<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Fare Dodgers</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="join" class="screen">
    <div class="panel">
      <div class="mark"><i></i><b></b></div>
      <h1>Fare Dodgers</h1>
      <form id="joinForm" autocomplete="off">
        <input id="name" maxlength="16" placeholder="Username" required>
        <button type="submit">Join</button>
      </form>
      <p id="joinError" class="error"></p>
    </div>
  </section>

  <section id="lobby" class="screen hidden">
    <div class="panel">
      <canvas id="lobbyAvatar" class="avatar"></canvas>
      <h1 id="lobbyName"></h1>
      <p class="muted">Waiting for the host</p>
      <p id="lobbyCount" class="muted small"></p>
    </div>
  </section>

  <section id="game" class="screen hidden">
    <canvas id="view"></canvas>
    <div id="progress"><div id="progressFill"></div></div>
    <div id="top">
      <span id="role"></span>
      <span id="info"></span>
    </div>
    <div id="notice" class="hidden"></div>
    <ul id="feed"></ul>
    <canvas id="minimap"></canvas>
    <div id="dpad" class="hidden">
      <button data-dir="3" class="up" aria-label="Up"></button>
      <button data-dir="2" class="left" aria-label="Left"></button>
      <button data-dir="0" class="right" aria-label="Right"></button>
      <button data-dir="1" class="down" aria-label="Down"></button>
    </div>
    <div id="center" class="hidden"></div>
    <div id="spectate" class="hidden">
      <button id="specPrev" aria-label="Previous">‹</button>
      <span id="specName"></span>
      <button id="specNext" aria-label="Next">›</button>
    </div>
  </section>

  <section id="end" class="overlay hidden">
    <div class="panel wide">
      <h1 id="endTitle"></h1>
      <p id="endSub" class="muted"></p>
      <div class="boards">
        <div><h2>Fare dodgers</h2><div id="pacBoard"></div></div>
        <div><h2>Inspectors</h2><div id="ghostBoard"></div></div>
      </div>
      <p class="muted small">Next round starts when the host is ready.</p>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="draw.js"></script>
  <script src="client.js"></script>
</body>
</html>
